name: Test Main City MCP

on:
  push:
    paths:
      - 'mcp-main-city/**'
      - '.github/workflows/test-main-city-mcp.yml'
  workflow_dispatch:

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: mcp-main-city
        run: npm install

      - name: Syntax check
        working-directory: mcp-main-city
        run: |
          node --check src/index.mjs
          node --check src/smoke-client.mjs

      - name: MCP protocol smoke test
        working-directory: mcp-main-city
        run: npm run test:mcp
